apiVersion: apps/v1
kind: Deployment

metadata:
  name: meilisearch

spec:
  replicas: 1

  selector:
    matchLabels:
      app: meilisearch

  template:
    metadata:
      labels:
        app: meilisearch

    spec:
      containers:
        - name: meilisearch

          image: getmeili/meilisearch:latest

          ports:
            - containerPort: 7700

          env:
            - name: MEILI_MASTER_KEY
              value: your-master-key-123

            - name: MEILI_ENV
              value: production

          volumeMounts:
            - name: meili-storage
              mountPath: /meili_data

      volumes:
        - name: meili-storage

          persistentVolumeClaim:
            claimName: meili-pvc
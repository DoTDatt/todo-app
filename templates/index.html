<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Todo App</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  h2 { margin-bottom: 12px; }
  input, select, button, textarea { font-size: 14px; padding: 6px 10px; }
  input, select { border: 1px solid #ccc; border-radius: 4px; }
  button { border: 1px solid #999; border-radius: 4px; cursor: pointer; background: #fff; }
  button.primary { background: #333; color: #fff; border-color: #333; }
  button.danger  { color: #c00; border-color: #c00; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .row label { min-width: 80px; }
  .row input, .row select { flex: 1; }
  hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
  #msg { color: red; font-size: 13px; margin-top: 6px; min-height: 18px; }
  #token-info { font-size: 12px; color: #555; margin-top: 6px; word-break: break-all; }

  /* todo list */
  #todo-list { list-style: none; padding: 0; margin-top: 12px; }
  #todo-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 1px solid #e0e0e0; border-radius: 6px;
    margin-bottom: 8px;
    background: #fafafa;
  }
  #todo-list li .info { flex: 1; }
  #todo-list li .title { font-weight: 500; }
  #todo-list li .desc  { font-size: 12px; color: #888; }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: #eee; color: #555;
  }
  .pill.pending     { background: #fff3cd; color: #856404; }
  .pill.in_progress { background: #cfe2ff; color: #084298; }
  .pill.done        { background: #d1e7dd; color: #0a3622; }

  /* filter bar */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-bar input, .filter-bar select { padding: 5px 8px; }

  /* inline edit form */
  .edit-form { display: none; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-top: 8px; }
  .edit-form .row { margin-bottom: 8px; }
  .edit-form.open { display: block; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tabs button { padding: 6px 16px; }
  .tabs button.active { background: #333; color: #fff; border-color: #333; }
  .page { display: none; }
  .page.active { display: block; }

  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #333; color: #fff;
    padding: 8px 16px; border-radius: 6px;
    font-size: 13px; display: none;
  }
</style>
</head>
<body>

<h2>📝 Todo App</h2>

<!-- TABS -->
<div class="tabs" id="tabs" style="display:none">
  <button class="active" onclick="showPage('todos')">Todos</button>
  <button onclick="showPage('add')">Thêm mới</button>
  <button onclick="doLogout()" class="danger">Đăng xuất</button>
</div>

<!-- AUTH PAGE -->
<div class="page active" id="page-auth">
  <div class="tabs">
    <button class="active" id="tab-login" onclick="switchAuth('login')">Đăng nhập</button>
    <button id="tab-register" onclick="switchAuth('register')">Đăng ký</button>
  </div>
  <div class="row"><label>Email</label><input id="email" type="email" placeholder="you@example.com"/></div>
  <div class="row"><label>Password</label><input id="pass" type="password" placeholder="min 6 ký tự"
    onkeydown="if(event.key==='Enter')submitAuth()"/></div>
  <button class="primary" onclick="submitAuth()" id="auth-btn">Đăng nhập</button>
  <div id="msg"></div>
</div>

<!-- TODOS PAGE -->
<div class="page" id="page-todos">
  <div class="filter-bar">
    <input id="search" placeholder="Tìm tiêu đề..." oninput="loadTodos()"/>
    <select id="fStatus" onchange="loadTodos()">
      <option value="">Tất cả</option>
      <option value="pending">Pending</option>
      <option value="in_progress">In Progress</option>
      <option value="done">Done</option>
    </select>
    <select id="fSort" onchange="loadTodos()">
      <option value="created_at">Mới nhất</option>
      <option value="title">Tên A-Z</option>
      <option value="id">ID</option>
    </select>
  </div>
  <ul id="todo-list"><li style="color:#888">Đang tải...</li></ul>
</div>

<!-- ADD PAGE -->
<div class="page" id="page-add">
  <h3 style="margin-bottom:12px">Thêm Todo</h3>
  <div class="row"><label>Tiêu đề *</label><input id="new-title" placeholder="Nhập tiêu đề"/></div>
  <div class="row"><label>Mô tả</label><input id="new-desc" placeholder="Mô tả (tuỳ chọn)"/></div>
  <div class="row">
    <label>Trạng thái</label>
    <select id="new-status">
      <option value="pending">Pending</option>
      <option value="in_progress">In Progress</option>
      <option value="done">Done</option>
    </select>
  </div>
  <button class="primary" onclick="addTodo()">Thêm</button>
  <div id="add-msg" style="color:red;font-size:13px;margin-top:6px"></div>
</div>

<div id="toast"></div>

<script>
const BASE = 'http://localhost:8080';
let token = '';
let authMode = 'login';

function api(method, path, body) {
  const h = {'Content-Type':'application/json'};
  if (token) h['Authorization'] = 'Bearer ' + token;
  return fetch(BASE + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined})
    .then(async r => {
      const text = await r.text();
      let d; try { d = JSON.parse(text); } catch { d = {message: text}; }
      if (!r.ok) throw new Error(d.error || d.message || r.status);
      return d;
    });
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}

/* AUTH */
function switchAuth(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode==='login');
  document.getElementById('tab-register').classList.toggle('active', mode==='register');
  document.getElementById('auth-btn').textContent = mode==='login' ? 'Đăng nhập' : 'Đăng ký';
  document.getElementById('msg').textContent = '';
}

function submitAuth() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const msg   = document.getElementById('msg');
  if (!email || !pass) { msg.textContent = 'Nhập email và password.'; return; }
  if (pass.length < 6) { msg.textContent = 'Password tối thiểu 6 ký tự.'; return; }
  msg.textContent = 'Đang xử lý...';
  api('POST', authMode === 'login' ? '/login' : '/register', {email, password: pass})
    .then(d => {
      if (authMode === 'register') { msg.style.color='green'; msg.textContent = 'Đăng ký thành công! Hãy đăng nhập.'; switchAuth('login'); return; }
      token = d.token;
      document.getElementById('page-auth').classList.remove('active');
      document.getElementById('tabs').style.display = 'flex';
      showPage('todos');
      loadTodos();
    })
    .catch(e => { msg.style.color='red'; msg.textContent = e.message; });
}

function doLogout() {
  token = '';
  document.getElementById('tabs').style.display = 'none';
  showPage('auth');
  document.getElementById('page-auth').classList.add('active');
  document.getElementById('msg').textContent = '';
}

/* PAGES */
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('#tabs button').forEach((b,i) => {
    b.classList.toggle('active', i === (name==='todos'?0:name==='add'?1:-1));
  });
  if (name === 'todos') loadTodos();
}

/* TODOS */
function loadTodos() {
  const p = new URLSearchParams();
  const st = document.getElementById('fStatus').value;
  const sr = document.getElementById('search').value.trim();
  const so = document.getElementById('fSort').value;
  if (st) p.set('status', st);
  if (sr) p.set('search', sr);
  p.set('sort', so);
  p.set('order', so === 'title' ? 'asc' : 'desc');
  api('GET', '/api/todos?' + p.toString())
    .then(renderList)
    .catch(e => document.getElementById('todo-list').innerHTML = `<li style="color:red">${e.message}</li>`);
}

function renderList(data) {
  const todos = Array.isArray(data) ? data : [];
  const ul = document.getElementById('todo-list');
  if (!todos.length) { ul.innerHTML = '<li style="color:#888">Không có todo nào.</li>'; return; }
  ul.innerHTML = todos.map(t => `
    <li id="item-${t.id}">
      <div class="info">
        <div class="title">${esc(t.title)}</div>
        ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ''}
      </div>
      <span class="pill ${t.status}">${pillLabel(t.status)}</span>
      <button onclick="toggleEdit(${t.id})">Sửa</button>
      <button class="danger" onclick="delTodo(${t.id})">Xóa</button>
      <div class="edit-form" id="edit-${t.id}">
        <div class="row"><label>Tiêu đề</label><input id="et-${t.id}" value="${esc(t.title)}"/></div>
        <div class="row"><label>Mô tả</label><input id="ed-${t.id}" value="${esc(t.description||'')}"/></div>
        <div class="row">
          <label>Trạng thái</label>
          <select id="es-${t.id}">
            <option value="pending" ${t.status==='pending'?'selected':''}>Pending</option>
            <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
            <option value="done" ${t.status==='done'?'selected':''}>Done</option>
          </select>
        </div>
        <button class="primary" onclick="updateTodo(${t.id})">Lưu</button>
        <button onclick="toggleEdit(${t.id})" style="margin-left:6px">Huỷ</button>
      </div>
    </li>`).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pillLabel(s) { return s==='pending'?'Pending':s==='in_progress'?'In Progress':'Done'; }

function toggleEdit(id) {
  const el = document.getElementById('edit-' + id);
  el.classList.toggle('open');
}

function updateTodo(id) {
  const title = document.getElementById('et-' + id).value.trim();
  if (!title) { toast('Tiêu đề không được trống!'); return; }
  api('PUT', '/api/todos/' + id, {
    title,
    description: document.getElementById('ed-' + id).value,
    status: document.getElementById('es-' + id).value
  }).then(() => { toast('Đã cập nhật!'); loadTodos(); })
    .catch(e => toast(e.message));
}

function delTodo(id) {
  if (!confirm('Xóa todo này?')) return;
  api('DELETE', '/api/todos/' + id)
    .then(() => { toast('Đã xóa!'); loadTodos(); })
    .catch(e => toast(e.message));
}

function addTodo() {
  const title = document.getElementById('new-title').value.trim();
  const msg   = document.getElementById('add-msg');
  if (!title) { msg.textContent = 'Tiêu đề không được trống!'; return; }
  api('POST', '/api/todos', {
    title,
    description: document.getElementById('new-desc').value,
    status: document.getElementById('new-status').value
  }).then(() => {
    toast('Đã thêm todo!');
    document.getElementById('new-title').value = '';
    document.getElementById('new-desc').value  = '';
    msg.textContent = '';
    showPage('todos');
  }).catch(e => { msg.textContent = e.message; });
}
</script>
</body>
</html>
